<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" id="IE_Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AttendX - Smart Attendance & Workforce System by Envision Beyond">

  <!-- iOS Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AttendX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.png"/>

  <title>AttendX - Smart Attendance System</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #EBF4FA 0%, #D6E8F9 100%);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
      animation: fadeIn 0.5s ease-in-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #1E293B;
      letter-spacing: 0.3px;
    }
    .brand-subtitle {
      font-size: 12px;
      color: #64748B;
      margin-top: 4px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="spinner"></div>
    <div class="brand-title">AttendX</div>
    <div class="brand-subtitle">Smart Attendance & Workforce System</div>
  </div>

  <script>
    window.addEventListener('load', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        setTimeout(function() {
          loading.style.display = 'none';
        }, 1500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
