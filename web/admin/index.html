<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttendX - System Admin Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="app-container">
    <aside class="sidebar">
      <div>
        <div class="brand-header">
          <div class="brand-logo"><i class="fa-solid fa-shield-halved"></i></div>
          <div>
            <div class="brand-title">AttendX</div>
            <span class="brand-badge">SYSTEM ADMIN</span>
          </div>
        </div>
        <ul class="nav-menu">
          <li class="nav-item active"><a href="#"><i class="fa-solid fa-sliders"></i> Policy Settings</a></li>
          <li class="nav-item"><a href="#"><i class="fa-solid fa-shield-cat"></i> System Audit Logs</a></li>
        </ul>
      </div>
    </aside>

    <main class="main-wrapper">
      <header class="topbar">
        <h2 class="page-header-title"><i class="fa-solid fa-user-shield"></i> System Administration Portal</h2>
        <a href="../index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Main Portal Hub</a>
      </header>
      <div class="content-body">
        <div class="glass-card" style="max-width: 600px;">
          <h3 class="card-title" style="margin-bottom: 1.25rem;"><i class="fa-solid fa-sliders"></i> Shift & Geofence Policy</h3>
          <div class="form-group"><label>Shift Start Time</label><input type="time" class="form-control" value="09:00"></div>
          <div class="form-group"><label>Shift End Time</label><input type="time" class="form-control" value="18:00"></div>
          <div class="form-group"><label>Grace Period (Mins)</label><input type="number" class="form-control" value="15"></div>
          <button class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save System Policy</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
