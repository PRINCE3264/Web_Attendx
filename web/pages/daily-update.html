<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AttendX - Daily Project Update">
  <title>AttendX - Daily Project Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <div id="app-container">
    <main class="main-wrapper">
      <div class="content-body">

        <div class="glass-card" style="max-width: 650px;">
          <h3 class="card-title" style="margin-bottom: 1.25rem;"><i class="fa-solid fa-clipboard-check"></i> Daily Project Update Sheet</h3>
          <form id="form-daily-update">
            <div class="form-group">
              <label>Select Project</label>
              <select class="form-control" required>
                <option value="AttendX Mobile & Web">AttendX Mobile & Web Application</option>
                <option value="Enterprise Dashboard">Enterprise Dashboard Refactoring</option>
              </select>
            </div>
            <div class="form-group">
              <label>Tasks Completed Today</label>
              <textarea class="form-control" placeholder="Detail tasks completed..." required></textarea>
            </div>
            <div class="form-group">
              <label>Hours Worked on Project</label>
              <input type="number" step="0.5" class="form-control" value="8.0" required>
            </div>
            <div class="form-group">
              <label>Blockers / Issues (Optional)</label>
              <textarea class="form-control" placeholder="Describe any blockers or issues..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Submit Daily Update</button>
          </form>
        </div>

        <!-- Previous Updates -->
        <div class="glass-card" style="margin-top: 1.5rem;">
          <h3 class="card-title" style="margin-bottom: 1rem;"><i class="fa-solid fa-clock-rotate-left"></i> Recent Submissions</h3>
          <table class="custom-table">
            <thead>
              <tr><th>Date</th><th>Project</th><th>Tasks</th><th>Hours</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr><td>2026-09-08</td><td>AttendX Web App</td><td>Implemented route-based pages</td><td>8.0 hrs</td><td><span class="badge badge-success">Submitted</span></td></tr>
              <tr><td>2026-09-07</td><td>AttendX Mobile App</td><td>Flutter UI updates & geofence refactoring</td><td>8.5 hrs</td><td><span class="badge badge-success">Approved</span></td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script>
    $(document).ready(function() {
      AttendXLayout.init('Daily Project Update');
    });
  </script>
</body>
</html>
