<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AttendX - Leave Management">
  <title>AttendX - Leave Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <div id="app-container">
    <main class="main-wrapper">
      <div class="content-body">

        <!-- Leave Balance Cards -->
        <div class="grid-4" style="margin-bottom: 1.5rem;">
          <div class="glass-card stat-card">
            <div class="stat-details">
              <h4>Casual Leave</h4>
              <div class="stat-value">12</div>
              <div class="stat-subtext">Remaining this year</div>
            </div>
            <div class="stat-icon primary"><i class="fa-solid fa-umbrella-beach"></i></div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-details">
              <h4>Sick Leave</h4>
              <div class="stat-value">6</div>
              <div class="stat-subtext">Remaining this year</div>
            </div>
            <div class="stat-icon warning"><i class="fa-solid fa-kit-medical"></i></div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-details">
              <h4>Earned Leave</h4>
              <div class="stat-value">15</div>
              <div class="stat-subtext">Accrued balance</div>
            </div>
            <div class="stat-icon success"><i class="fa-solid fa-award"></i></div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-details">
              <h4>Total Taken</h4>
              <div class="stat-value">7</div>
              <div class="stat-subtext">This year so far</div>
            </div>
            <div class="stat-icon purple"><i class="fa-solid fa-calendar-minus"></i></div>
          </div>
        </div>

        <!-- Apply Leave Button -->
        <div class="card-header-flex" style="margin-bottom: 1.5rem;">
          <h2>Leave Applications</h2>
          <button class="btn btn-primary" data-modal="modal-apply-leave">
            <i class="fa-solid fa-plus"></i> Apply For Leave
          </button>
        </div>

        <!-- My Leave Requests -->
        <div id="container-my-leaves">
          <!-- Dynamic Leave Cards from Firestore -->
        </div>

      </div>
    </main>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script>
    $(document).ready(function() {
      AttendXLayout.init('Leave Management');
    });
  </script>
</body>
</html>
