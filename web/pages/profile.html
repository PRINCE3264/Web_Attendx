<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AttendX - My Profile">
  <title>AttendX - My Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <div id="app-container">
    <main class="main-wrapper">
      <div class="content-body">

        <div class="grid-2">
          <!-- Profile Card -->
          <div class="glass-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
              <div class="profile-avatar-circle" style="width: 90px; height: 90px; font-size: 2.5rem; background: var(--primary); color: #fff; margin: 0 auto 1rem;">P</div>
              <h2 style="margin-bottom: 0.3rem;">PRINCE VIDYARTHI</h2>
              <span class="badge badge-info" style="margin-bottom: 0.5rem;">Senior Software Engineer</span>
              <div style="font-size: 0.85rem; color: var(--text-muted);">EMP ID: EMP-1024 • Engineering Dept</div>
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
              <div class="form-group"><label>Full Name</label><input type="text" class="form-control" value="Prince Vidyarthi"></div>
              <div class="form-group"><label>Email Address</label><input type="email" class="form-control" value="prince.v@attendx.com" readonly></div>
              <div class="form-group"><label>Phone Number</label><input type="tel" class="form-control" value="+91 98765 43210"></div>
              <div class="form-group"><label>Date of Joining</label><input type="text" class="form-control" value="January 15, 2024" readonly></div>
              <button class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-floppy-disk"></i> Update Profile</button>
            </div>
          </div>

          <!-- Work Details -->
          <div>
            <div class="glass-card" style="margin-bottom: 1.5rem;">
              <h3 class="card-title" style="margin-bottom: 1.25rem;"><i class="fa-solid fa-briefcase"></i> Work Information</h3>
              <div class="form-group"><label>Department</label><input type="text" class="form-control" value="Engineering" readonly></div>
              <div class="form-group"><label>Designation</label><input type="text" class="form-control" value="Senior Software Engineer" readonly></div>
              <div class="form-group"><label>Reporting Manager</label><input type="text" class="form-control" value="Rajesh Kumar (TL)" readonly></div>
              <div class="form-group"><label>Office Location</label><input type="text" class="form-control" value="Headquarters (Geofence Verified)" readonly></div>
              <div class="form-group"><label>Shift Timing</label><input type="text" class="form-control" value="09:00 AM - 06:00 PM" readonly></div>
            </div>

            <!-- Quick Stats -->
            <div class="glass-card">
              <h3 class="card-title" style="margin-bottom: 1rem;"><i class="fa-solid fa-chart-simple"></i> Attendance Summary</h3>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div style="text-align: center; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent-emerald);">94.2%</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">On-Time Rate</div>
                </div>
                <div style="text-align: center; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">168.5h</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Monthly Hours</div>
                </div>
                <div style="text-align: center; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent-amber);">18</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Leave Balance</div>
                </div>
                <div style="text-align: center; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent-purple);">3</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Active Projects</div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script>
    $(document).ready(function() {
      AttendXLayout.init('My Profile');
    });
  </script>
</body>
</html>
