<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AttendX - Reset your password">
  <title>AttendX - Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <!-- Branded Header -->
    <div class="auth-card-header">
      <div class="auth-logo">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1>Reset Password</h1>
      <p>We'll send you a reset link</p>
    </div>

    <!-- Forgot Password Form -->
    <div class="auth-card-body">
      <div class="auth-error-msg" id="reset-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="reset-error-text"></span>
      </div>
      <div class="auth-success-msg" id="reset-success">
        <i class="fa-solid fa-circle-check"></i>
        <span id="reset-success-text"></span>
      </div>

      <div style="text-align: center; margin-bottom: 1.5rem;">
        <i class="fa-solid fa-envelope-circle-check" style="font-size: 3rem; color: var(--primary); margin-bottom: 0.75rem; display: block;"></i>
        <p style="font-size: 0.88rem; color: var(--text-muted); line-height: 1.5;">
          Enter the email address associated with your account and we'll send you a link to reset your password.
        </p>
      </div>

      <form id="form-forgot-password">
        <div class="form-group">
          <label>Email Address</label>
          <div class="auth-input-icon-wrap">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" class="form-control" id="reset-email" placeholder="you@company.com" required>
          </div>
        </div>

        <button type="submit" class="auth-btn" id="btn-reset">
          <span class="spinner" id="reset-spinner"></span>
          <i class="fa-solid fa-paper-plane"></i>
          <span id="reset-btn-text">Send Reset Link</span>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      Remember your password? <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script>
    $(document).ready(function () {
      $('#form-forgot-password').on('submit', async function (e) {
        e.preventDefault();

        const email = $('#reset-email').val().trim();

        // Show loading
        $('#btn-reset').prop('disabled', true);
        $('#reset-spinner').show();
        $('#reset-btn-text').text('Sending...');
        $('#reset-error').removeClass('visible');
        $('#reset-success').removeClass('visible');

        const result = await AttendXAuth.resetPassword(email);

        if (result.success) {
          $('#reset-success-text').text(result.message);
          $('#reset-success').addClass('visible');
          $('#btn-reset').prop('disabled', true);
          $('#reset-spinner').hide();
          $('#reset-btn-text').text('Email Sent ✓');
        } else {
          $('#reset-error-text').text(result.error);
          $('#reset-error').addClass('visible');
          $('#btn-reset').prop('disabled', false);
          $('#reset-spinner').hide();
          $('#reset-btn-text').text('Send Reset Link');
        }
      });
    });
  </script>
</body>
</html>
