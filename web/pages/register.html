<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AttendX - Create your account">
  <title>AttendX - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <!-- Branded Header -->
    <div class="auth-card-header">
      <div class="auth-logo">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1>Create Account</h1>
      <p>Join the AttendX Smart Portal</p>
    </div>

    <!-- Register Form -->
    <div class="auth-card-body">
      <div class="auth-error-msg" id="register-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="register-error-text"></span>
      </div>
      <div class="auth-success-msg" id="register-success">
        <i class="fa-solid fa-circle-check"></i>
        <span id="register-success-text"></span>
      </div>

      <form id="form-register">
        <div class="form-group">
          <label>Full Name</label>
          <div class="auth-input-icon-wrap">
            <i class="fa-regular fa-user"></i>
            <input type="text" class="form-control" id="reg-name" placeholder="Enter your full name" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="auth-input-icon-wrap">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" class="form-control" id="reg-email" placeholder="you@company.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Department</label>
          <select class="form-control" id="reg-department" required>
            <option value="">Select Department</option>
            <option value="Engineering">Engineering</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Operations">Operations</option>
            <option value="Marketing">Marketing</option>
            <option value="Finance">Finance</option>
            <option value="Sales">Sales</option>
          </select>
        </div>

        <div class="form-group">
          <label>Select Your Role</label>
          <div class="auth-role-select" id="role-selector">
            <div class="auth-role-option selected" data-role="employee">
              <i class="fa-solid fa-user"></i>
              Employee
            </div>
            <div class="auth-role-option" data-role="manager">
              <i class="fa-solid fa-user-tie"></i>
              Manager / TL
            </div>
            <div class="auth-role-option" data-role="hr">
              <i class="fa-solid fa-users-gear"></i>
              HR Admin
            </div>
            <div class="auth-role-option" data-role="admin">
              <i class="fa-solid fa-shield-halved"></i>
              System Admin
            </div>
          </div>
          <input type="hidden" id="reg-role" value="employee">
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="auth-input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="form-control" id="reg-password" placeholder="Min 6 characters" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="auth-input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="form-control" id="reg-confirm-password" placeholder="Re-enter password" required minlength="6">
          </div>
        </div>

        <button type="submit" class="auth-btn" id="btn-register">
          <span class="spinner" id="register-spinner"></span>
          <i class="fa-solid fa-user-plus"></i>
          <span id="register-btn-text">Create Account</span>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script>
    $(document).ready(function () {
      // Role selector click handler
      $('.auth-role-option').on('click', function () {
        $('.auth-role-option').removeClass('selected');
        $(this).addClass('selected');
        $('#reg-role').val($(this).attr('data-role'));
      });

      $('#form-register').on('submit', async function (e) {
        e.preventDefault();

        const name = $('#reg-name').val().trim();
        const email = $('#reg-email').val().trim();
        const department = $('#reg-department').val();
        const role = $('#reg-role').val();
        const password = $('#reg-password').val();
        const confirmPassword = $('#reg-confirm-password').val();

        // Validation
        $('#register-error').removeClass('visible');
        $('#register-success').removeClass('visible');

        if (!department) {
          $('#register-error-text').text('Please select a department.');
          $('#register-error').addClass('visible');
          return;
        }

        if (password !== confirmPassword) {
          $('#register-error-text').text('Passwords do not match. Please re-enter.');
          $('#register-error').addClass('visible');
          return;
        }

        // Show loading
        $('#btn-register').prop('disabled', true);
        $('#register-spinner').show();
        $('#register-btn-text').text('Creating Account...');

        const result = await AttendXAuth.register(name, email, password, department, role);

        if (result.success) {
          $('#register-success-text').text('Account created successfully! Redirecting to login...');
          $('#register-success').addClass('visible');
          setTimeout(function () {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          $('#register-error-text').text(result.error);
          $('#register-error').addClass('visible');
          $('#btn-register').prop('disabled', false);
          $('#register-spinner').hide();
          $('#register-btn-text').text('Create Account');
        }
      });
    });
  </script>
</body>
</html>
