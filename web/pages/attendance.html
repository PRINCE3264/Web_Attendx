<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AttendX - My Attendance History">
  <title>AttendX - My Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <div id="app-container">
    <main class="main-wrapper">
      <div class="content-body">

        <div class="glass-card">
          <div class="card-header-flex">
            <h3 class="card-title"><i class="fa-solid fa-calendar-days"></i> Full Attendance Logs</h3>
            <button class="btn btn-outline btn-sm" data-modal="modal-correction-request">
              <i class="fa-solid fa-plus"></i> Submit Correction
            </button>
          </div>
          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr><th>Date</th><th>Employee</th><th>Punch In</th><th>Punch Out</th><th>Duration</th><th>Status</th></tr>
              </thead>
              <tbody id="table-attendance-history">
                <!-- Rendered via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script>
    $(document).ready(function() {
      AttendXLayout.init('My Attendance');
    });
  </script>
</body>
</html>
